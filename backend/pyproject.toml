[project]
name = "unvoice-backend"
version = "0.1.0"
description = "Vocal-removal MVP backend (FastAPI + Demucs)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "soundfile>=0.12",
    "numpy>=1.26,<2.3",
    "demucs>=4.0.1",
    # torch is pulled in by demucs; for CUDA install torch separately from
    # https://download.pytorch.org/whl/cu121
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
    "slow: real Demucs runs; opt in with -m slow",
]
